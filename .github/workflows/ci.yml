name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests (unit + integration, skipping live API)
        env:
          RUN_LIVE_API: 0
        run: |
          pytest -q --maxfail=1 --disable-warnings

      - name: Upload test artifacts (logs, shap artifacts if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            artifacts/
            mlruns/
            ./*.log
          if-no-files-found: ignore
